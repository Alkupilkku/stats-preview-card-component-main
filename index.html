<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="stats.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/image-header-desktop.jpg">

  <title>Frontend Mentor | Stats preview card component</title>
</head>

<body>
  <div class="wrapper">
    <!-- Divide the card-->
    <div class="business-info">
      <h1>Get <span style="color:rgb(150, 70, 203)">insights</span> that help your business grow.</h1>
      <p class="discover">Discover the benefits of data analytics and make better decisions regarding revenue, customer
        experience, and overall efficiency.</p>
      <div class="stats">
        <article class="stats-info">
          <p id="numbers">10k+</p>
          <p id="statistics">Companies</p>
        </article>
        <article class="stats-info">
          <p id="numbers">314</p>
          <p id="statistics">Templates</p>
        </article>
        <article class="stats-info">
          <p id="numbers">12m+</p>
          <p id="statistics">Queries</p>
        </article>
      </div>
    </div>
    <div class="image">
      <img src="./images/image-header-desktop.jpg" alt="people around a work table">
    </div>
  </div>

</body>

</html>
